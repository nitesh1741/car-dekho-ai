# Docker Compose configuration for Car-Dekho AI project\n\nversion: "3.9"\n\nservices:\n  backend:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile\n    container_name: car_dekho_backend\n    ports:\n      - "8000:8000"\n    restart: unless-stopped\n    # Optional: environment variables\n    # environment:\n    #   - LOG_LEVEL=info\n\n  frontend:\n    build:\n      context: ./frontend\n      dockerfile: Dockerfile\n    container_name: car_dekho_frontend\n    ports:\n      - "3000:3000"\n    restart: unless-stopped\n    depends_on:\n      - backend\n    # Optional: environment variables\n    # environment:\n    #   - API_URL=http://backend:8000\n\nnetworks:\n  default:\n    driver: bridge\n
